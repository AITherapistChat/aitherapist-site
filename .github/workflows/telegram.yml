name: Посты в телеграм-канал

# У Телеграма нет отложки для ботов, поэтому расписание держим здесь:
# воркфлоу просыпается, смотрит tools/tg/schedule.json и публикует то, чему
# подошло время. Что уже ушло — записано в tools/tg/posted.json, повтор
# ничего не задваивает, а пропущенный запуск ничего не теряет.
#
# ⚠️ Пост уходит НЕ в свой `when`, а в момент, когда проснулся раннер, — поэтому
# частота крона задаёт точность публикации. `schedule` у GitHub работает «по
# возможности»: события идут из общей очереди, под нагрузкой опаздывают, а иногда
# теряются совсем. Было три слота в сутки в 09:05/16:05/20:05 UTC — опоздания
# росли с 22 минут (23.08.2026) до 8 часов, а 28.08.2026 два слота из трёх не
# запустились вовсе, и пост, стоявший на 19:00 МСК, вышел в 23:46.
# Поэтому: минуты непопулярные (не 0 и не 5 — их занимают все) и слотов много,
# чтобы потеря одного стоила 20 минут, а не полдня.
# Часы ограничены окном 11:07–19:47 МСК осознанно: посты стоят на 12:00 МСК
# (см. TG_TIME в tools/tg/build_schedule.py), и весь остаток окна — это запас
# повторных попыток в разумное время. Если и он выйдет — пост подождёт следующего
# дня, а не вывалится ночью на спящий канал. Расширять окно вверх незачем.
on:
  schedule:
    - cron: '7,27,47 8-16 * * *'   # UTC → каждые 20 мин с 11:07 до 19:47 МСК
  workflow_dispatch:               # и кнопкой вручную

permissions:
  contents: write

concurrency:
  group: telegram-posts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Опубликовать всё, чему подошло время
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tools/tg/post_due.py

      - name: Запомнить, что опубликовано
        # if: always() — предыдущий шаг падает, если у какого-то поста не нашлась картинка;
        # остальные при этом уже ушли, и их отметку надо сохранить, иначе задвоятся
        if: always()
        run: |
          if [[ -n "$(git status --porcelain tools/tg/posted.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/tg/posted.json
            git commit -m "tg: отметка об опубликованных постах"
            git push
          else
            echo "новых публикаций не было"
          fi
